<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Field Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, dense work tool for a busy field sales engineer — no decoration, fast to scan
   IDEA: a dispatcher's job board: stages as lanes, regions as territories, HIGH marked in red
   PICTURE: the live board itself — today's attention list large at the top of Home
   COLOUR and TYPE: white / ink / vermilion #ff4a1c reserved for HIGH + actions; Sofia Sans Condensed + Instrument Sans
   LAYOUT: one column up to 760px, bottom tab bar, floating command button */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#110d0b);--panel:light-dark(#f5f3f1,#1c1714);--ink:light-dark(#121212,#f3efec);
--mute:light-dark(#6a635f,#a69d97);--line:light-dark(#e4e0dd,#2f2825);--acc:light-dark(#ff4a1c,#ff6a40);
--accsoft:light-dark(#fff0eb,#3a1a10);--ok:light-dark(#1d7a4c,#5fd296);--warn:light-dark(#a86400,#f2b450);--chip:light-dark(#ebe7e4,#29221e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) max(4vw,16px) calc(env(safe-area-inset-bottom) + 150px)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font:800 26px/1 "Sofia Sans Condensed",sans-serif;letter-spacing:.2px}
.brand b{color:var(--acc)}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--acc)}
h1,h2,h3{font-family:"Sofia Sans Condensed",sans-serif;font-weight:800;line-height:1.05;margin:0}
h1{font-size:clamp(32px,8vw,44px);text-wrap:balance}
h2{font-size:24px;margin:26px 0 10px}
h3{font-size:19px}
.sub{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.stat{background:var(--panel);border-radius:12px;padding:10px 12px;border:0;text-align:left}
.stat b{display:block;font:800 clamp(28px,7vw,38px)/1 "Sofia Sans Condensed",sans-serif}
.stat span{font-size:13px;color:var(--mute)}
.stat.hot{background:var(--acc);color:#fff}.stat.hot span{color:#fff;opacity:.9}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0;border:0;width:100%;text-align:left}
.banner b{font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.card.hi{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.card .body{flex:1}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card.done .t{text-decoration:line-through;color:var(--mute)}
.meta{font-size:13px;color:var(--mute);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .late{color:var(--acc);font-weight:600}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;margin-top:1px;display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill{flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--chip);border:0;white-space:nowrap;letter-spacing:.2px}
.pill.DOING{background:light-dark(#e3efff,#16294a);color:light-dark(#1550a8,#8fb8ff)}
.pill.PENDING{background:light-dark(#fff3dc,#3a2a0c);color:var(--warn)}
.pill.DONE,.pill.WON,.pill.RESOLVED{background:light-dark(#e2f4ea,#11301f);color:var(--ok)}
.pill.HIGH,.pill.OPEN{background:var(--accsoft);color:var(--acc)}
.pill.LOST{color:var(--mute)}
.tag{font-size:11px;font-weight:700;color:#fff;background:var(--acc);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;min-height:38px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.red.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:16px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;min-height:44px;background:var(--chip)}
.btn.pri{background:var(--acc);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px}
.btn.danger{background:none;color:var(--acc);border:1px solid var(--acc)}
.empty{padding:22px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;font-size:15px}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sectionhead h2{margin-bottom:10px}
.link{background:none;border:0;color:var(--acc);font-weight:700;padding:6px 0;font-size:14px}
.regions{display:grid;gap:10px}
.region{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);text-align:left;width:100%}
.region h3{font-size:26px}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.rgrid div{font-size:12px;color:var(--mute)}
.rgrid b{display:block;font:800 22px/1.1 "Sofia Sans Condensed",sans-serif;color:var(--ink)}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--panel);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:800 30px/1 "Sofia Sans Condensed",sans-serif}
.kpi span{font-size:13px;color:var(--mute)}
.kpi em{font-style:normal;font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--acc)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:160px;margin-top:10px;border-bottom:1px solid var(--line)}
.months .m{display:flex;gap:2px;align-items:end;height:100%;justify-content:center}
.months .m i{display:block;width:42%;max-width:14px;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.months .m i.prev{background:var(--chip)}
.mlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11px;color:var(--mute);text-align:center;margin-top:4px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));z-index:20}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;position:relative;min-height:48px}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:23px;height:23px}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--acc);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(env(safe-area-inset-bottom) + 78px);width:62px;height:62px;border-radius:50%;background:var(--acc);color:#fff;border:0;box-shadow:0 8px 24px rgba(255,74,28,.35);display:grid;place-items:center;z-index:21}
.fab svg{width:32px;height:32px}
@media(min-width:800px){.fab{right:calc(50% - 370px)}}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:41;padding:16px max(4vw,16px) calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}
.sheet:not(.on){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet.top{top:0;bottom:auto;border-radius:0 0 18px 18px;padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:16px;transform:translateY(-105%)}
.sheet.top.on{transform:none}
.sheet.top .grab{display:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.f input,.f select,.f textarea{font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-height:44px;width:100%;color:var(--ink)}
.f textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1}
.cmd{width:100%;min-height:96px;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--ink);background:var(--bg);resize:vertical}
.hint{font-size:13px;color:var(--mute);margin:8px 0 12px;display:flex;gap:8px;align-items:center}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.mic.live{background:var(--acc);color:#fff}
.kindsw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);padding:4px;border-radius:12px;margin:12px 0}
.kindsw button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px}
.kindsw button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.log{border-left:2px solid var(--line);padding-left:12px;display:grid;gap:8px;font-size:14px}
.log small{color:var(--mute);display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;display:none;align-items:center;gap:14px;max-width:92vw}
.toast.on{display:flex}
.toast button{background:none;border:0;color:var(--acc);font-weight:700}
.ex{font-size:14px;display:grid;gap:6px}
.ex code{display:block;background:var(--panel);padding:8px 10px;border-radius:8px;font-family:inherit;overflow-wrap:anywhere}
.ar{direction:rtl;text-align:right}
.morelist{display:grid;gap:8px}
.morelist button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:17px}
.morelist small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.contact a{color:var(--acc);font-weight:600;text-decoration:none}
.aireply{background:var(--panel);border-radius:12px;padding:12px 14px;margin-top:12px;white-space:pre-wrap;line-height:1.6;unicode-bidi:plaintext}
.actrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.actrow input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--acc)}
.actrow small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.actrow.danger{border-color:var(--acc)}.actrow.danger b{color:var(--acc)}
.steps{padding-left:20px;display:grid;gap:6px}.steps a{color:var(--acc);font-weight:700}
.lang{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;min-height:32px}
.crow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.crow .cname{flex:1;font-size:16px;padding:9px 10px;border-radius:9px;border:1px solid transparent;background:var(--panel);min-height:40px}
.crow .cname:focus{border-color:var(--ink);outline:none}
.crow input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;flex:none}
.crow .cnt{min-width:22px;text-align:center}
.crow .btn.small{min-height:36px;min-width:36px;padding:6px 8px}
.crow .btn:disabled{opacity:.3}
.sw{display:flex;align-items:center;gap:10px;flex:1;font-weight:600;padding:6px 4px}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.fwrap{display:grid;gap:6px}
.frow{display:flex;gap:6px;flex-wrap:wrap;padding-left:4px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Field<b>Desk</b></div>
    <div class="sync" id="sync"><i></i><span>Starting…</span></div>
  </header>
  <main id="main"></main>
</div>

<button class="fab" data-act="cmd" aria-label="AI assistant">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 2.5c.6 5 2.6 7 7.5 7.6c-4.9.6-6.9 2.6-7.5 7.6c-.6-5-2.6-7-7.5-7.6c4.9-.6 6.9-2.6 7.5-7.6z"/><path d="M18.5 13.8c.3 2.2 1.1 3 3.3 3.3c-2.2.3-3 1.1-3.3 3.3c-.3-2.2-1.1-3-3.3-3.3c2.2-.3 3-1.1 3.3-3.3z"/><path d="M18.6 1.8c.2 1.3.7 1.8 2 2c-1.3.2-1.8.7-2 2c-.2-1.3-.7-1.8-2-2c1.3-.2 1.8-.7 2-2z"/></svg>
</button>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Tasks<span class="badge" id="b-tasks" hidden></span></button>
  <button data-tab="issues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/></svg>Issues<span class="badge" id="b-issues" hidden></span></button>
  <button data-tab="contacts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 5.2a3.3 3.3 0 0 1 0 6M18 14.6c2 .7 3.2 2.5 3.6 5.4"/></svg>Contacts</button>
  <button data-tab="regions" aria-label="Browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Browse</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</button>
</nav>

<div class="veil" id="veil" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span></span><button id="toastBtn" hidden>Undo</button></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
{
/* ---------- constants ---------- */
const PALETTE=['#ff4a1c','#1550a8','#1d7a4c','#8a3ffc','#b26b00','#0f7c8c','#c2185b','#5d6b2f'];
const slugId=(p,n)=>p+String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)+'-'+Math.random().toString(36).slice(2,5);
const HOMEW=[['stats','Key numbers'],['banner','Reminders (monthly report, backup)'],['attention','Needs attention'],['followups','Quotations to follow up'],['renewals','Contracts expiring'],['today','Today & in progress'],['aging','Issues waiting 7+ days'],['main','Main view (choose below)'],['pipeline','Open opportunities']];
const DIMS=[['region','Regions'],['lob','Lines of business'],['dept','Departments']];
const CTYPES=['None','AMC','Comprehensive','Warranty','Other'];
const DEF_CFG={
  regions:[{id:'asir',name:'Asir',color:'#ff4a1c'},{id:'jazan',name:'Jazan',color:'#1550a8'},{id:'najran',name:'Najran',color:'#1d7a4c'}],
  depts:['Sales','Service','Spare Parts','Projects','Procurement','Finance','Logistics'].map((n,i)=>({id:'d'+i,name:n})),
  lobs:['Chillers','Service Contracts (AMC)','Spare Parts','Retrofit & Upgrades','Controls & BMS','Unitary & Ducted'].map((n,i)=>({id:'l'+i,name:n})),
  home:HOMEW.map(([k])=>({k,on:k!=='pipeline'})),
  mainView:'region',followDays:7,renewDays:60
};
let REGIONS=DEF_CFG.regions,DEPTS=DEF_CFG.depts,LOBS=DEF_CFG.lobs,HOME=DEF_CFG.home,RCOL={},MAINV='region',FDAYS=7,RDAYS=60;
const STAGES=['TO DO','DOING','PENDING','DONE'];
const PRI=['HIGH','LOW'];
const ISTAT=['OPEN','WAITING','RESOLVED'];
const WAITON=['Customer','Spare parts','Internal dept','Supplier','Other'];
const OSTAGES=['LEAD','QUOTED','NEGOTIATION','WON','LOST'];
const PTYPES=['Governorate','City','Site','Customer'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SPEC={
 task:[['title','Title','text'],['stage','Stage','sel',STAGES],['priority','Priority','sel',PRI],['due','Due date','date'],['region','Region','region'],['place','Place','place'],['contact','Contact','contact'],['notes','Notes','area']],
 issue:[['title','Issue','text'],['status','Status','sel',ISTAT],['priority','Priority','sel',PRI],['waitingOn','Waiting on','sel',WAITON],['owner','Who must act','text'],['region','Region','region'],['place','Place','place'],['contact','Contact','contact'],['notes','Details','area']],
 opp:[['title','Opportunity','text'],['description','Description','area'],['amount','Amount (SAR)','num'],['oppStage','Stage','sel',OSTAGES],['priority','Priority','sel',PRI],['due','Next step / close date','date'],['region','Region','region'],['place','Place','place'],['contact','Contact','contact']],

function setSync(s){

async function initSync(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
  let db=null,user=null;
  try{[db,user,dict,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('dictation'),claude.use('downloads')])}catch(e){}
  render();
  if(!db||!user){setSync('local');return}
  let id=null;try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  try{col=db.collection('data/users/'+id)}catch(e){setSync('local');return}
  setSync('connecting');
  const timer=setTimeout(()=>setSync('slow'),10000);
  let first=true;
  col.onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,Object.assign({},v,{id:d.id}))});
    if(snap.metadata.fromCache){if(m.size===0)return;items=m;saveLocal();render();return}
    clearTimeout(timer);setSync('ok');
    if(first){first=false;if(m.size===0&&items.size>0){[...items.values()].forEach(o=>{const c=clean(o);write(o.id,()=>col.doc(o.id).set(c))});render();return}}
    items=m;saveLocal();render();
  },e=>{clearTimeout(timer);setSync('error');col=null;toast('Sync stopped — changes are kept on this device.')});
}

const inR=(ts,a,b)=>ts&&ts>=a&&ts<b;
function monthReport(){
  const [y,m]=st.repMonth.split('-').map(Number);const a=new Date(y,m-1,1).getTime(),b=new Date(y,m,1).getTime();
  const T=all('task'),I=all('issue'),O=all('opp');
  const done=T.filter(t=>t.stage==='DONE'&&inR(t.doneAt,a,b)).sort((p,q)=>p.doneAt-q.doneAt);
  const created=T.filter(t=>inR(t.createdAt,a,b));
  const hiOpen=T.filter(t=>isOpenT(t)&&t.priority==='HIGH').sort(sortTasks);
  const late=T.filter(overdue);
  const iOpened=I.filter(i=>inR(i.createdAt,a,b)),iRes=I.filter(i=>i.status==='RESOLVED'&&inR(i.resolvedAt,a,b));
  const avgRes=iRes.length?Math.round(iRes.reduce((s,i)=>s+(i.resolvedAt-i.createdAt)/864e5,0)/iRes.length):null;
  const iStill=I.filter(issueActive).sort((p,q)=>p.createdAt-q.createdAt);
  const oNew=O.filter(o=>inR(o.createdAt,a,b)),oWon=O.filter(o=>o.oppStage==='WON'&&inR(o.closedAt,a,b));
  const stageMix=STAGES.map(s=>[s,T.filter(t=>t.stage===s).length]);const tot=Math.max(1,T.length);
  const rows=[...REGIONS.map(r=>[r.id,r.name]),['','No region']].map(([id,n])=>{const f=o=>(o.region||'')===id;return {n,done:done.filter(f).length,created:created.filter(f).length,open:T.filter(t=>f(t)&&isOpenT(t)).length,iRes:iRes.filter(f).length,iOpen:iStill.filter(f).length,won:oWon.filter(f).reduce((s,o)=>s+(+o.amount||0),0)}}).filter(r=>r.n!=='No region'||r.done+r.created+r.open+r.iRes+r.iOpen+r.won>0);
  const rate=created.length?Math.round(created.filter(t=>t.stage==='DONE').length/created.length*100):null;
  return `<h1 style="margin-top:14px">${MON[m-1]} ${y}: ${done.length} task${done.length===1?'':'s'} completed</h1>
  <p class="sub">${created.length} created this month${rate!==null?` · ${rate}% of them already done`:''}</p>
  <div class="kpis" style="margin:14px 0"><div class="kpi"><b>${done.length}</b><span>Completed</span></div><div class="kpi" style="${hiOpen.length?'background:var(--acc);color:#fff':''}"><b>${hiOpen.length}</b><span style="${hiOpen.length?'color:#fff':''}">High priority open</span></div><div class="kpi"><b>${late.length}</b><span>Overdue now</span></div>
  <div class="kpi"><b>${iRes.length}</b><span>Issues resolved${avgRes!==null?` · avg ${avgRes}d`:''}</span></div><div class="kpi"><b>${iOpened.length}</b><span>Issues opened</span></div><div class="kpi"><b style="font-size:22px">${money(oWon.reduce((s,o)=>s+(+o.amount||0),0))}</b><span>Won · ${oNew.length} new deal${oNew.length===1?'':'s'}</span></div></div>

function yearStats(y,rid,key){

const B='(^|[\\s,،.;:!?])',E='(?=$|[\\s,،.;:!?])';

function parseContact(s,o){
  s=s.trim();

  for(const r of REGIONS){const all2=(RALIAS[r.id]||[]).concat([r.name.toLowerCase()]);const re=new RegExp('(^|[\\s,،])(?:(?:in|region|منطقة)\\s+)?(?:'+all2.map(reEsc).join('|')+')(?:\\s+region)?'+E,'i');if(re.test(s)){o.region=r.id;s=s.replace(re,' ');break}}
  const kw=(re,k)=>{const m=s.match(re);if(m){o[k]=m[1].trim();s=s.replace(m[0],' ,')}};
  kw(/(?:department|dept|قسم)\s*(?:is\s+)?([^,،]+)/i,'department');
  kw(/(?:responsible for|in charge of|handles|responsibility|مسؤول عن|مسئول عن|مسؤوليته)\s*([^,،]+)/i,'responsibility');
  kw(/(?:company|from|شركة)\s+([^,،]+)/i,'company');
  const parts=s.split(/\s*[,،\n]\s*|\s+-\s+/).map(x=>x.trim()).filter(Boolean);
  o.name=parts.shift()||'';
  for(const p of parts){if(!o.department)o.department=p;else if(!o.responsibility)o.responsibility=p;else if(!o.company)o.company=p;else o.notes=(o.notes?o.notes+', ':'')+p}
  o.name=o.name.replace(/\b[a-z]/g,c=>c.toUpperCase());
  return o;
}

    const k=el.dataset.v;const txt=cur.title||cur.name||'';
    cmdState.parsed=Object.assign({},cur,{kind:k,title:txt,name:txt});
    if(k==='task'&&!cmdState.parsed.stage)cmdState.parsed.stage='TO DO';if(k==='issue'&&!cmdState.parsed.status)cmdState.parsed.status='OPEN';if(k==='opp'&&!cmdState.parsed.oppStage)cmdState.parsed.oppStage='LEAD';
    if(k==='contact'&&cmdState.text){const pc=parseCmd('contact '+cmdState.text.replace(/^\s*\S+\s*/,''));Object.assign(cmdState.parsed,pc)}
    return showParsed()}
  if(a==='mic'){
    if(!dict)return;const btn=$('#micBtn');
    if(btn.classList.contains('live')){stopDict();return}
    const ta=$('#cmdText');dictBuf=ta.value?ta.value.trim()+' ':'';
    dict.onPartial(({text})=>{const t=$('#cmdText');if(t)t.value=dictBuf+text});
    dict.onFinal(({text})=>{dictBuf+=text+' ';const t=$('#cmdText');if(t)t.value=dictBuf});
    dict.onState(({state})=>{const b=$('#micBtn');if(b)b.classList.toggle('live',state==='listening');if(state==='idle'){const t=$('#cmdText');if(t&&t.value.trim()){if(aiOn())return aiRun(t.value.trim());cmdState.text=t.value;cmdState.parsed=parseCmd(t.value);showParsed()}}});
    dict.start().catch(err=>{if(err&&err.code==='not_granted')toast('Microphone not allowed — type instead')});
    return}
  if(a==='export'){
    const data=JSON.stringify({app:'field-desk',version:1,exported:new Date().toISOString(),items:[...items.values()]},null,1);
    const fname='field-desk-backup-'+today()+'.json';
    const ok=()=>{try{localStorage.setItem('fielddesk.lastBackup',String(Date.now()))}catch(e){}toast('Backup saved');render()};
    if(dl){dl.save({filename:fname,data}).then(ok).catch(err=>{if(err&&err.code!=='declined')toast('Could not save the file')});return}
    const file=new File([data],fname,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Field Desk backup'}).then(ok).catch(()=>{});return}
    const url=URL.createObjectURL(file);const a2=document.createElement('a');a2.href=url;a2.download=fname;document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);ok();return}
  if(a==='import'){$('#importFile').click();return}
});
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const arr=Array.isArray(j)?j:j.items;let n=0;
    (arr||[]).forEach(o=>{if(o&&o.id&&(SPEC[o.kind]||o.kind==='config')){put(o,true);n++}});render();toast(`Imported ${n} item${n===1?'':'s'}`)}
  catch(err){toast('That file is not a Field Desk backup')}
  e.target.value='';
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cmdText'){e.preventDefault();$('[data-act="readcmd"]').click()}
});

render();setSync('local');initSync();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__fd={parseCmd,icsText};
}
</script>
</body>
</html>
